[package]
name = "cookielessaudiences"
version = "0.1.0"
edition = "2021"
authors = ["Alpha Quantum <info@alpha-quantum.com>"]
description = "Rust client for the Cookieless Audiences API: page-level audience segmentation and IAB content categorization for any URL, with no cookies and no PII"
license = "MIT"
homepage = "https://www.cookielessaudiences.com"
repository = "https://github.com/explainableaixai/cookielessaudiences-rust"
documentation = "https://www.cookielessaudiences.com/api.php"
readme = "README.md"
keywords = ["adtech", "audience", "cookieless", "iab", "segmentation"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
